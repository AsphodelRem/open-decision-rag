[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionrag"
version = "0.0.1"
description = "Cached hierarchical retrieval with decision models and local OpenJev"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10,<3",
    "httpx>=0.27,<1",
    "filelock>=3.16,<4",
    "typing-extensions>=4.12,<5",
    "tomli>=2,<3;python_version<'3.11'",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "sentence-transformers>=3,<6"
]

[project.optional-dependencies]
dev = [
    "wemake-python-styleguide==1.8.1",
    "build>=1,<2",
    "mypy==1.20.2"
]

[project.scripts]
decisionrag = "odr.cli:main"

[tool.setuptools]
packages = [
    "odr",
    "odr.builders",
    "odr.chunker",
    "odr.corpus",
    "odr.evaluation",
    "odr.models",
    "odr.schema",
    "odr.storage",
    "odr.search_engine",
    "decisionrag"
]

[tool.setuptools.package-dir]
decisionrag = "odr/decisionrag"

[tool.setuptools.package-data]
decisionrag = ["resources/*.txt", "py.typed"]
odr = ["py.typed"]
