name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[dev]'

      - name: Run WPS
        run: python -m flake8 --select=WPS,E999 --format=default odr tests

      - name: Run mypy
        run: python -m mypy --config-file mypy.ini odr tests

      - name: Build distribution
        run: python -m build

      - name: Verify installed public API
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          python -c 'import decisionrag, odr; assert decisionrag.Chunk is odr.Chunk; assert decisionrag.ModelDiagnostics is odr.ModelDiagnostics'
